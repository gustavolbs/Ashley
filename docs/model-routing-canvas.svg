<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Personas model routing</title>
  <desc id="desc">Sol is the control plane for investigation and decisions. Luna is the execution plane for bounded work. Fast tasks can go directly to Luna. Provider boundaries are preserved.</desc>
  <rect width="1200" height="760" rx="28" fill="#0b1020"/>
  <text x="64" y="72" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">AI Personas · model routing</text>
  <text x="64" y="108" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">Sol thinks and decides. Luna executes. Reuse child context before respawning.</text>

  <rect x="64" y="156" width="1072" height="96" rx="18" fill="#151d33" stroke="#334155"/>
  <text x="92" y="193" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">1 · Classify scope</text>
  <text x="92" y="224" font-family="system-ui, sans-serif" font-size="16" fill="#cbd5e1">FAST obvious task → Luna direct · Non-trivial investigation / ambiguity / high-consequence decision → Sol control plane</text>

  <rect x="64" y="292" width="486" height="214" rx="22" fill="#172554" stroke="#3b82f6"/>
  <text x="96" y="336" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#dbeafe">SOL · control plane</text>
  <text x="96" y="374" font-family="system-ui, sans-serif" font-size="17" fill="#bfdbfe">investigation · root cause · architecture</text>
  <text x="96" y="404" font-family="system-ui, sans-serif" font-size="17" fill="#bfdbfe">strategy · decomposition · orchestration</text>
  <text x="96" y="434" font-family="system-ui, sans-serif" font-size="17" fill="#bfdbfe">consequential decisions · substantial review</text>
  <text x="96" y="474" font-family="ui-monospace, monospace" font-size="15" fill="#93c5fd">output → compact execution packet</text>

  <rect x="650" y="292" width="486" height="214" rx="22" fill="#052e2b" stroke="#14b8a6"/>
  <text x="682" y="336" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ccfbf1">LUNA · execution plane</text>
  <text x="682" y="374" font-family="system-ui, sans-serif" font-size="17" fill="#99f6e4">implementation · calculations · variants</text>
  <text x="682" y="404" font-family="system-ui, sans-serif" font-size="17" fill="#99f6e4">tests · routine diagnostics · validation</text>
  <text x="682" y="434" font-family="system-ui, sans-serif" font-size="17" fill="#99f6e4">review fixes · bounded configuration work</text>
  <text x="682" y="474" font-family="ui-monospace, monospace" font-size="15" fill="#5eead4">return → evidence + decision blockers only</text>

  <path d="M550 398 H650" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M650 458 C610 548 590 548 550 458" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="600" y="574" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">new decision only → resume the same Sol planner when possible</text>

  <rect x="64" y="622" width="1072" height="82" rx="18" fill="#111827" stroke="#334155"/>
  <text x="92" y="655" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Provider-local invariant</text>
  <text x="92" y="684" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">Native parent → native children · RouteMux parent → RouteMux children · no silent cross-provider fallback · approval gates remain unchanged</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
