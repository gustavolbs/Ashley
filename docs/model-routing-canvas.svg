<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">AI Personas model routing canvas</title>
  <desc id="desc">Laila coordinates six domain personas. Each persona has a default model and bounded child lanes with explicit escalation rules.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <style>
      .title { font: 700 42px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; letter-spacing: .2px; }
      .subtitle { font: 400 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .section { font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E2E8F0; }
      .card-title { font: 700 20px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .card-copy { font: 400 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .lane-title { font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .lane-copy { font: 400 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .model { font: 700 13px "SFMono-Regular", Consolas, monospace; fill: #F8FAFC; }
      .muted { font: 400 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3B8; }
      .rule { stroke: #334155; stroke-width: 1; }
      .edge { fill: none; stroke: #64748B; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 7 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2400" height="1500" fill="#0F172A"/>
  <rect x="44" y="40" width="2312" height="1420" rx="24" fill="#111C33" stroke="#253555" stroke-width="1"/>

  <text x="88" y="108" class="title">Persona orchestration and model routing</text>
  <text x="88" y="143" class="subtitle">Luna first. Keep every child on the parent provider. Increase reasoning before changing model family.</text>
  <text x="2310" y="108" text-anchor="end" class="muted">AI Personas / RouteMux / 2026-09-23</text>

  <!-- Main coordinator -->
  <g filter="url(#shadow)">
    <rect x="920" y="188" width="560" height="190" rx="18" fill="#172554" stroke="#F59E0B" stroke-width="2"/>
    <rect x="920" y="188" width="560" height="12" rx="6" fill="#F59E0B"/>
    <text x="956" y="246" class="card-title">Laila</text>
    <text x="956" y="275" class="card-copy">Cross-functional coordinator</text>
    <text x="956" y="314" class="lane-title">Default model</text>
    <text x="956" y="339" class="model">provider-local Luna tier</text>
    <text x="956" y="365" class="card-copy">medium effort / compact handoffs / terminal child evidence</text>
  </g>

  <text x="88" y="442" class="section">Domain personas and their bounded child lanes</text>

  <!-- Coordinator edges -->
  <path d="M1040 378 C820 410 230 410 230 500" class="edge"/>
  <path d="M1100 378 C980 420 580 420 580 500" class="edge"/>
  <path d="M1170 378 C1120 430 930 430 930 500" class="edge"/>
  <path d="M1230 378 C1280 430 1280 430 1280 500" class="edge"/>
  <path d="M1300 378 C1420 420 1630 420 1630 500" class="edge"/>
  <path d="M1360 378 C1580 410 1980 410 1980 500" class="edge"/>

  <!-- Persona cards -->
  <g filter="url(#shadow)">
    <rect x="80" y="500" width="300" height="190" rx="14" fill="#172554" stroke="#60A5FA" stroke-width="2"/>
    <rect x="430" y="500" width="300" height="190" rx="14" fill="#102A2A" stroke="#2DD4BF" stroke-width="2"/>
    <rect x="780" y="500" width="300" height="190" rx="14" fill="#142B22" stroke="#4ADE80" stroke-width="2"/>
    <rect x="1130" y="500" width="300" height="190" rx="14" fill="#241A38" stroke="#C084FC" stroke-width="2"/>
    <rect x="1480" y="500" width="300" height="190" rx="14" fill="#2A1A24" stroke="#FB7185" stroke-width="2"/>
    <rect x="1830" y="500" width="300" height="190" rx="14" fill="#2A2314" stroke="#FBBF24" stroke-width="2"/>
  </g>

  <text x="108" y="546" class="card-title">Dave</text>
  <text x="108" y="572" class="card-copy">Application engineering</text>
  <text x="108" y="616" class="lane-title">Parent</text>
  <text x="108" y="640" class="model">Luna / medium</text>
  <text x="108" y="672" class="card-copy">implements and integrates</text>

  <text x="458" y="546" class="card-title">Ashley</text>
  <text x="458" y="572" class="card-copy">Product, UX and visual</text>
  <text x="458" y="616" class="lane-title">Parent</text>
  <text x="458" y="640" class="model">Luna / medium</text>
  <text x="458" y="672" class="card-copy">screenshots and canvas work</text>

  <text x="808" y="546" class="card-title">Guto</text>
  <text x="808" y="572" class="card-copy">Platform and SRE</text>
  <text x="808" y="616" class="lane-title">Parent</text>
  <text x="808" y="640" class="model">Luna / medium</text>
  <text x="808" y="672" class="card-copy">read-only investigation first</text>

  <text x="1158" y="546" class="card-title">Clara</text>
  <text x="1158" y="572" class="card-copy">Finance and risk</text>
  <text x="1158" y="616" class="lane-title">Parent</text>
  <text x="1158" y="640" class="model">Luna / medium</text>
  <text x="1158" y="672" class="card-copy">scenarios and evidence</text>

  <text x="1508" y="546" class="card-title">Roberto</text>
  <text x="1508" y="572" class="card-copy">Business strategy</text>
  <text x="1508" y="616" class="lane-title">Parent</text>
  <text x="1508" y="640" class="model">Luna / medium</text>
  <text x="1508" y="672" class="card-copy">choices under constraint</text>

  <text x="1858" y="546" class="card-title">Ana</text>
  <text x="1858" y="572" class="card-copy">Growth and comms</text>
  <text x="1858" y="616" class="lane-title">Parent</text>
  <text x="1858" y="640" class="model">Luna / medium</text>
  <text x="1858" y="672" class="card-copy">copy, analytics and lifecycle</text>

  <!-- Child lane edges -->
  <path d="M230 690 L230 770" class="edge-soft"/>
  <path d="M230 690 C230 735 150 735 150 770" class="edge-soft"/>
  <path d="M230 690 C230 735 310 735 310 770" class="edge-soft"/>
  <path d="M580 690 L580 770" class="edge-soft"/>
  <path d="M930 690 L930 770" class="edge-soft"/>
  <path d="M1280 690 L1280 770" class="edge-soft"/>
  <path d="M1630 690 L1630 770" class="edge-soft"/>
  <path d="M1980 690 L1980 770" class="edge-soft"/>

  <!-- Dave lanes -->
  <g>
    <rect x="80" y="770" width="300" height="140" rx="12" fill="#17233D" stroke="#334155"/>
    <text x="104" y="806" class="lane-title">Implement</text>
    <text x="104" y="834" class="model">provider-local Luna / high</text>
    <text x="104" y="864" class="lane-copy">Increase effort before</text>
    <text x="104" y="884" class="lane-copy">changing model family.</text>
    <rect x="80" y="930" width="300" height="140" rx="12" fill="#17233D" stroke="#334155"/>
    <text x="104" y="966" class="lane-title">Independent QA</text>
    <text x="104" y="994" class="model">provider-local reviewer / high</text>
    <text x="104" y="1024" class="lane-copy">Read-only diff, tests,</text>
    <text x="104" y="1044" class="lane-copy">evidence and re-check.</text>
    <rect x="80" y="1090" width="300" height="140" rx="12" fill="#261F16" stroke="#B7791F"/>
    <text x="104" y="1126" class="lane-title">Opt-in escalation</text>
    <text x="104" y="1154" class="model">provider-local Pro / high</text>
    <text x="104" y="1184" class="lane-copy">Only after failed acceptance;</text>
    <text x="104" y="1204" class="lane-copy">avoid forced tool_choice.</text>
  </g>

  <!-- Other persona lanes -->
  <g>
    <rect x="430" y="770" width="300" height="140" rx="12" fill="#102A2A" stroke="#285E61"/>
    <text x="454" y="806" class="lane-title">Visual / screenshot QA</text>
    <text x="454" y="834" class="model">Luna / medium</text>
    <text x="454" y="864" class="lane-copy">Image input, canvas and</text>
    <text x="454" y="884" class="lane-copy">rendered artifact inspection.</text>

    <rect x="780" y="770" width="300" height="140" rx="12" fill="#142B22" stroke="#2F855A"/>
    <text x="804" y="806" class="lane-title">Config review</text>
    <text x="804" y="834" class="model">GLM Flash / medium</text>
    <text x="804" y="864" class="lane-copy">Bounded, read-only review.</text>
    <text x="804" y="884" class="lane-copy">Manual Sol gate for risk.</text>

    <rect x="1130" y="770" width="300" height="140" rx="12" fill="#241A38" stroke="#805AD5"/>
    <text x="1154" y="806" class="lane-title">Material risk review</text>
    <text x="1154" y="834" class="model">Luna / medium</text>
    <text x="1154" y="864" class="lane-copy">Sol is manually selected</text>
    <text x="1154" y="884" class="lane-copy">for high-consequence gates.</text>

    <rect x="1480" y="770" width="300" height="140" rx="12" fill="#2A1A24" stroke="#B83280"/>
    <text x="1504" y="806" class="lane-title">Independent research</text>
    <text x="1504" y="834" class="model">GLM Flash / medium</text>
    <text x="1504" y="864" class="lane-copy">Text-heavy second opinion;</text>
    <text x="1504" y="884" class="lane-copy">Luna remains the default.</text>

    <rect x="1830" y="770" width="300" height="140" rx="12" fill="#2A2314" stroke="#B7791F"/>
    <text x="1854" y="806" class="lane-title">Copy / analytics review</text>
    <text x="1854" y="834" class="model">GLM Flash / medium</text>
    <text x="1854" y="864" class="lane-copy">Independent text review;</text>
    <text x="1854" y="884" class="lane-copy">manual Sol for material risk.</text>
  </g>

  <!-- Footer -->
  <rect x="80" y="1290" width="620" height="112" rx="12" fill="#17233D" stroke="#334155"/>
  <text x="108" y="1324" class="lane-title">Active subagent pool</text>
  <text x="108" y="1352" class="model">native GPT parent → native GPT children  |  RouteMux parent → RouteMux children</text>
  <text x="108" y="1380" class="muted">3 active children maximum; one bounded reviewer by default.</text>

  <rect x="730" y="1290" width="760" height="112" rx="12" fill="#102A2A" stroke="#285E61"/>
  <text x="758" y="1324" class="lane-title">Escalation rules</text>
  <text x="758" y="1352" class="lane-copy">Increase reasoning first. Pro is opt-in after failed acceptance.</text>
  <text x="758" y="1380" class="lane-copy">Sol is manual only. No silent fallback or invented model IDs.</text>

  <rect x="1520" y="1290" width="800" height="112" rx="12" fill="#261F16" stroke="#B7791F"/>
  <text x="1548" y="1324" class="lane-title">Lifecycle evidence</text>
  <text x="1548" y="1352" class="lane-copy">Keep child id, wait for terminal result, then verify integrated state.</text>
  <text x="1548" y="1380" class="lane-copy">A successful spawn or empty active list is not completion evidence.</text>

  <line x1="80" y1="1255" x2="2320" y2="1255" class="rule"/>
  <text x="80" y="1278" class="muted">Model choice is a bounded execution policy, not a replacement for domain authority or approval gates.</text>
</svg>
